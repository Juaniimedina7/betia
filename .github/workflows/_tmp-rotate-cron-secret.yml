name: TEMP - Rotate CRON_SECRET in Vercel

# One-off fix (2026-09-08): the CRON_SECRET stored in Vercel no longer matched the
# CRON_SECRET GitHub secret, so every /api/ingest/* cron (poll-odds, cleanup-odds,
# settle-bets) has been returning 401 since at least 2026-08-28. sync-env.mjs can't
# fix this on its own because it deliberately never overwrites a key Vercel already
# has. This workflow force-replaces CRON_SECRET in all three Vercel environments with
# the current value of the (already-rotated) CRON_SECRET GitHub secret, then should be
# deleted — it's not meant to be a recurring tool.
on:
  workflow_dispatch:

env:
  VERCEL_ORG_ID: team_klaQ4k4O3uyzx9gNCCsGWN91
  VERCEL_PROJECT_ID: prj_9S2peNPSAokYC3YpeOdX6MVCzEXJ

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Force-replace CRON_SECRET in every environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          for env in production preview development; do
            vercel env rm CRON_SECRET "$env" --yes --token="$VERCEL_TOKEN" || true
            printf '%s' "$CRON_SECRET" | vercel env add CRON_SECRET "$env" --token="$VERCEL_TOKEN"
          done
