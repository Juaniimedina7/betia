name: Deploy to Vercel

# Deploya a produccion en cada push a main, usando el token de Vercel de Juani
# (guardado como secret VERCEL_TOKEN). Asi el deploy queda a nombre de esta cuenta.
on:
  push:
    branches: [main]
  workflow_dispatch: # permite dispararlo a mano desde la pestania Actions

# El org y el project no son secretos: son los IDs del proyecto betia-web.
env:
  VERCEL_ORG_ID: team_klaQ4k4O3uyzx9gNCCsGWN91
  VERCEL_PROJECT_ID: prj_9S2peNPSAokYC3YpeOdX6MVCzEXJ

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build project artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
