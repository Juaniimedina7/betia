name: Poll odds once a day

# Vercel Hobby solo permite crons de 1 vez por dia, asi que esto corre desde
# GitHub Actions en su lugar y pega directo al endpoint de ingesta.
#
# The Odds API factura por cuota MENSUAL (500 requests/mes en el plan actual —
# confirmado en vivo el 2026-09-02), y el costo real es 1 credito por MARKET
# pedido por llamada (no por bookmaker: pedir 2 bookmakers via el parametro
# `bookmakers` sigue costando 1 credito si se pide 1 solo market). Esto es un
# modelo de costo distinto al de OddsPapi (que facturaba por llamada HTTP, con
# lotes de 5 tournamentIds) — no asumas que la formula vieja sigue valiendo.
#
# /api/ingest/poll pide 1 market (h2h) x sport_keys watcheados (ver
# apps/web/lib/ingest/watched-sport-keys.ts):
#   - 13 ligas de futbol (fijas)
#   - basketball_nba, americanfootball_nfl (fijas)
#   - hasta 2 torneos de tenis ACTIVOS, descubiertos en vivo cada corrida via
#     sports_cache.active — el tenis no tiene "una liga" continua como el
#     futbol, cada torneo (Wimbledon, US Open, etc.) es su propio sport_key
#     que solo esta activo ~1-2 semanas al anio, asi que esto es dinamico en
#     vez de hardcodeado.
# => 15 fijos + hasta 2 de tenis = ~15-17 requests/corrida. A 1 corrida/dia
# (ver el horario abajo) son ~30 corridas/mes x 15-17 = ~450-510 requests/mes,
# cerca del limite de 500/mes pero con margen la mayoria de los meses (el pico
# de 17 solo pasa si hay 2 torneos de tenis simultaneos, lo cual no es todo el
# anio). Bajado de 16 a 13 ligas de futbol el 2026-09-03 para hacer lugar a
# NBA/NFL/tenis: se saco Copa America (sin edicion activa) ademas de Portugal
# Primeira Liga y Chile Primera (las dos ligas de menor volumen que quedaban,
# las copas continentales se mantienen a proposito). Redo this math (runs/day
# x sport_keys x markets x 30) antes de subir la cadencia, la lista de ligas,
# el cap de tenis o los markets pedidos.
#
# DEFAULT_BOOKMAKERS (apps/web/app/api/ingest/poll/route.ts) tiene 7 casas
# (pinnacle, unibet, betano_uk, codere_it, betsson, betway, espnbet) — subirlo
# de 2 a 7 NO cambia el presupuesto de arriba, porque el costo es por market
# pedido, no por bookmaker.
#
# Corre 1 vez/dia a las 17:00 hora Argentina (UTC-3) = 20:00 UTC — elegido
# 2026-09-03 en vez del horario anterior (09:00 UTC / 06:00 ART) para que la
# actualizacion caiga mas cerca de la ventana en la que la audiencia principal
# (Argentina) usa la plataforma.
on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch: # permite dispararlo a mano desde la pestania Actions

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Poll odds
        run: |
          code=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            "https://betia-web-brown.vercel.app/api/ingest/poll" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "HTTP $code"
          cat /tmp/response.json
          if [ "$code" != "200" ]; then
            exit 1
          fi

      # Independent step/route on purpose — a failure here must never mask a
      # successful odds poll above (or vice versa). See CLAUDE.md's "Highlightly
      # quota" section for the request budget this route stays under.
      - name: Poll team stats (Highlightly)
        run: |
          code=$(curl -s -o /tmp/response-stats.json -w "%{http_code}" \
            "https://betia-web-brown.vercel.app/api/ingest/poll-stats" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "HTTP $code"
          cat /tmp/response-stats.json
          if [ "$code" != "200" ]; then
            exit 1
          fi
