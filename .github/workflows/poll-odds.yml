name: Poll odds twice a day

# Vercel Hobby solo permite crons de 1 vez por dia, asi que esto corre desde
# GitHub Actions en su lugar y pega directo al endpoint de ingesta.
#
# The Odds API factura por cuota MENSUAL (500 requests/mes en el plan actual —
# confirmado en vivo el 2026-09-02), y el costo real es 1 credito por MARKET
# pedido por llamada (no por bookmaker: pedir 2 bookmakers via el parametro
# `bookmakers` sigue costando 1 credito si se pide 1 solo market). Esto es un
# modelo de costo distinto al de OddsPapi (que facturaba por llamada HTTP, con
# lotes de 5 tournamentIds) — no asumas que la formula vieja sigue valiendo.
#
# ACTUALIZACION 2026-09-08: el futbol se saco por completo de este cron — ver
# CLAUDE.md, seccion "eliminar The Odds API de futbol". Todas las cuotas de
# futbol (13 ligas fijas) ahora salen exclusivamente del paso de API-Football
# mas abajo, no de este. /api/ingest/poll pide 1 market (h2h) x sport_keys
# watcheados (ver apps/web/lib/ingest/watched-sport-keys.ts), que ahora es
# solo:
#   - basketball_nba, americanfootball_nfl (fijas)
#   - hasta 2 torneos de tenis ACTIVOS, descubiertos en vivo cada corrida via
#     sports_cache.active — el tenis no tiene "una liga" continua como el
#     futbol, cada torneo (Wimbledon, US Open, etc.) es su propio sport_key
#     que solo esta activo ~1-2 semanas al anio, asi que esto es dinamico en
#     vez de hardcodeado.
# => 2 fijos + hasta 2 de tenis = ~2-4 requests/corrida. A 2 corridas/dia (ver
# el horario abajo, cambiado de 1 a 2 corridas/dia el 2026-09-08) son ~60
# corridas/mes x 2-4 = ~120-240 requests/mes, todavia lejos del limite de
# 500/mes. Redo this math (runs/day x sport_keys x markets x 30) antes de
# subir la cadencia, agregar deportes o cambiar los markets pedidos.
#
# DEFAULT_BOOKMAKERS (apps/web/app/api/ingest/poll/route.ts) tiene 7 casas
# (pinnacle, unibet, betano_uk, codere_it, betsson, betway, espnbet) — subirlo
# de 2 a 7 NO cambia el presupuesto de arriba, porque el costo es por market
# pedido, no por bookmaker. Desde 2026-09-08 esta lista solo aplica a
# NBA/NFL/tenis (ver arriba).
#
# Corre 2 veces por dia: 12:00 y 18:00 hora Argentina (15:00 y 21:00 UTC,
# cambiado de "cada 60 minutos" el 2026-09-08). El paso de API-Football abajo
# bajo DAYS_AHEAD de 7 a 3 el mismo dia especificamente para que esto entre en
# su cap de 100/dia con 2 corridas (ver ese archivo).
on:
  schedule:
    - cron: "0 15 * * *"
    - cron: "0 21 * * *"
  workflow_dispatch: # permite dispararlo a mano desde la pestania Actions

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Poll odds
        run: |
          code=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            "https://betia-web-brown.vercel.app/api/ingest/poll" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "HTTP $code"
          cat /tmp/response.json
          if [ "$code" != "200" ]; then
            exit 1
          fi


      # Since 2026-09-08 this is the SOLE source of soccer odds (see CLAUDE.md's
      # "eliminar The Odds API de futbol" section) — the main odds poll above no
      # longer requests any soccer sport_key at all. Bet365 (not on The Odds API at
      # all) is one of only 2 bookmakers this step is allowed to store
      # (DEFAULT_API_FOOTBALL_BOOKMAKERS), so soccer's bookmaker coverage is now
      # narrower than it was pre-migration — a deliberate, documented tradeoff, not
      # an oversight. See CLAUDE.md's "API-Football odds quota" section for the
      # confirmed-live request budget (up to ~91 requests/day worst case on the
      # Free plan) this step stays under. Independent step for the same reason as
      # the stats poll above — a failure here must not mask a successful stats poll.
      - name: Poll odds (API-Football, sole soccer odds source)
        run: |
          code=$(curl -s -o /tmp/response-api-football.json -w "%{http_code}" \
            "https://betia-web-brown.vercel.app/api/ingest/poll-api-football-odds" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "HTTP $code"
          cat /tmp/response-api-football.json
          if [ "$code" != "200" ]; then
            exit 1
          fi
