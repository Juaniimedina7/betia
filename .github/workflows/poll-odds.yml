name: Poll odds once a day

# Vercel Hobby solo permite crons de 1 vez por dia, asi que esto corre desde
# GitHub Actions en su lugar y pega directo al endpoint de ingesta.
#
# OddsPapi factura por cuota MENSUAL (250 requests/mes en el plan actual), no
# por ventana horaria. /api/ingest/poll ahora pollea 2 bookmakers (Pinnacle +
# uno mas, para que build_combo pueda calcular edge real desde odds_cache en
# vez de pegarle en vivo a OddsPapi) — 20 tournamentIds watcheados, en lotes
# de 5, son ~4 requests/corrida/bookmaker => ~8 requests/corrida. 1 corrida/dia
# son ~30/mes x 8 = ~240 requests/mes, dejando margen para workflow_dispatch
# manuales. Bajamos de 2 a 1 corrida/dia para que sumar el segundo bookmaker
# entre en la cuota — redo this math (runs/day x tournamentIds/5 x bookmakers
# x 30) antes de subir la cadencia, la lista de torneos o de bookmakers.
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch: # permite dispararlo a mano desde la pestania Actions

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Poll odds
        run: |
          code=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            "https://betia-web-brown.vercel.app/api/ingest/poll" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "HTTP $code"
          cat /tmp/response.json
          if [ "$code" != "200" ]; then
            exit 1
          fi

      # Independent step/route on purpose — a failure here must never mask a
      # successful odds poll above (or vice versa). See CLAUDE.md's "Highlightly
      # quota" section for the request budget this route stays under.
      - name: Poll team stats (Highlightly)
        run: |
          code=$(curl -s -o /tmp/response-stats.json -w "%{http_code}" \
            "https://betia-web-brown.vercel.app/api/ingest/poll-stats" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "HTTP $code"
          cat /tmp/response-stats.json
          if [ "$code" != "200" ]; then
            exit 1
          fi
